<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Radar MacBook</title>
<style>
:root{--bg:#e9ebee;--sf:#f7f8f9;--tx:#1d2026;--mu:#69707c;--ln:#cfd3d9;--ac:#2b5fd9;--ok:#1f8a4c;--no:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#15171b;--sf:#1e2126;--tx:#e8eaed;--mu:#98a0ac;--ln:#32363d;--ac:#7ba2ff;--ok:#5cc88a;--no:#ff8a78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 14px 40px}
h1{font-size:22px;margin:16px 0 4px}.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
.big{font-size:28px;font-weight:700}
button,select{font:inherit;font-size:15px;padding:9px 12px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
button.go{background:var(--ac);color:#fff;border:0}
.card{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px;color:inherit;text-decoration:none}
.card img{width:92px;height:92px;object-fit:cover;border-radius:8px;background:var(--ln);flex:none}
.card b{display:block;font-size:15px}
.ok{color:var(--ok)}.no{color:var(--no)}
</style></head><body>
<h1>Radar MacBook</h1>
<div class="bar"><div><div class="big" id="n">0</div><div class="mu" id="up"></div></div>
<span style="flex:1"></span><button class="go" onclick="load()">Actualiser</button></div>
<div class="bar"><select id="f" onchange="draw()"><option value="">Tous les pays</option></select>
<button onclick="settings()">Réglages</button></div>
<div id="st" class="mu"></div><div id="l"></div>
<script>
var D={items:[],status:{}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){fetch("data/items.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){D=d;
var f=document.getElementById("f"),c={};d.items.forEach(function(i){c[i.country]=1});
var cur=f.value;f.innerHTML='<option value="">Tous les pays</option>'+Object.keys(c).map(function(k){return"<option>"+esc(k)+"</option>"}).join("");f.value=cur;draw()}).catch(function(){document.getElementById("l").innerHTML='<p class="mu">Pas encore de données. Lance le radar une première fois.</p>'})}
function draw(){var f=document.getElementById("f").value,L=D.items.filter(function(i){return!f||i.country==f});
document.getElementById("n").textContent=D.items.length+" annonces";
document.getElementById("up").textContent=D.updated?"Mis à jour le "+D.updated:"";
var bad=Object.keys(D.status||{}).filter(function(k){return D.status[k]!="ok"});
document.getElementById("st").textContent=bad.length?"Marchés en erreur : "+bad.map(function(k){return k+" ("+D.status[k]+")"}).join(", "):"";
document.getElementById("l").innerHTML=L.map(function(i){var t=i.flag=="ok"?'<span class="ok">'+esc(i.year)+"</span>":i.flag=="out"?'<span class="no">'+esc(i.year)+" (hors plage)</span>":'<span class="mu">année ?</span>';
return'<a class="card" target="_blank" rel="noopener" href="'+esc(i.url)+'"><img loading="lazy" src="'+esc(i.photo)+'" alt=""><div><b>'+esc(i.title)+'</b><div>'+Math.round(i.price)+" "+esc(i.cur)+" · "+esc(i.country)+'</div><div>'+t+'</div><div class="mu">Détecté '+new Date(i.found).toLocaleString("fr-FR")+"</div></div></a>"}).join("")}
function settings(){var m=location.hostname.match(/^(.+)\.github\.io$/),r=location.pathname.split("/")[1];
if(m&&r)location.href="https://github.com/"+m[1]+"/"+r+"/edit/main/config.json";else alert("Ouvre config.json dans ton dépôt GitHub pour modifier les critères.")}
load();
</script></body></html>
